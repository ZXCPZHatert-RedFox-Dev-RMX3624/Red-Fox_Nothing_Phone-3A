name: Red Fox Recovery Auto-Compiler

on:
  workflow_dispatch: # Запуск сборки вручную одной кнопкой на сайте!

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Clone Toolchain & Manifests
      run: |
        git clone https://github.com -b twrp-14.0 base_twrp/

    - name: Integrate Red Fox Device Tree
      run: |
        mkdir -p base_twrp/device/nothing/pacman
        cp -r device/nothing/pacman/* base_twrp/device/nothing/pacman/ || true
        cp *.mk base_twrp/device/nothing/pacman/ || true

    - name: Run Build Script
      run: |
        cd base_twrp/
        echo "source build/envsetup.sh && lunch twrp_pacman-eng && mka recoveryimage" > build_fox_cloud.sh
        chmod +x build_fox_cloud.sh
        ./build_fox_cloud.sh || true

    - name: Check Out Recovery
      run: |
        mkdir -p output/
        cp base_twrp/out/target/product/pacman/recovery.img output/ || echo "Идет компиляция..."

    - name: Upload Final Red Fox Recovery
      uses: actions/upload-artifact@v4
      with:
        name: Red-Fox-Recovery-Nothing-3A
        path: output/
